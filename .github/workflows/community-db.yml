name: Community database

on:
  push:
    branches:
      - main
      - "phase-6*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-contracts:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Start local Postgres
        run: supabase db start

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Test migrations and RLS
        run: supabase test db
