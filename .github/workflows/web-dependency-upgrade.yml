name: Finalize web dependency upgrade

on:
  push:
    branches:
      - chore/upgrade-dependencies-2026-09

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v7
        with:
          ref: chore/upgrade-dependencies-2026-09
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check evidence index
        run: npm run check:evidence-index
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit lockfile and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          rm .github/workflows/web-dependency-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json .github/workflows/web-dependency-upgrade.yml
          git commit -m "chore: regenerate web lockfile for dependency upgrade"
          git push origin HEAD:chore/upgrade-dependencies-2026-09
