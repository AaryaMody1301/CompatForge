name: Phase 6B web lockfile

on:
  push:
    branches:
      - phase-6b/authenticated-submission-ui

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Phase 6B branch
        uses: actions/checkout@v6
        with:
          ref: phase-6b/authenticated-submission-ui

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Regenerate lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore: lock Phase 6B web dependencies"
          git push origin HEAD:phase-6b/authenticated-submission-ui
