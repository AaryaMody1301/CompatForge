name: CompatForge Release Provenance

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "data/**"
      - "dbt/**"
      - "pipeline/**"
      - "tools/package_web_release.py"
      - "pyproject.toml"
      - "docs/RELEASE_PROVENANCE.md"
      - "docs/RELEASE_ACCEPTANCE.md"
      - ".github/workflows/release-provenance.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-bundle:
    name: Build and verify release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install release tooling
        run: python -m pip install -e "."

      - name: Verify reviewed local evidence snapshot
        run: >-
          compatforge-snapshot verify
          --observations data/evidence/observations
          --support data/evidence/vendor

      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production web artifact
        working-directory: apps/web
        env:
          COMPATFORGE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Package deterministic web build output
        run: >-
          python tools/package_web_release.py
          --web-root apps/web
          --output build/release/compatforge-web-build.tar.gz

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/web
          format: spdx-json
          output-file: build/release/compatforge-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build immutable release manifest
        run: >-
          python -m compatforge_pipeline.release_manifest build
          --repository-root .
          --release-root build/release
          --commit "$GITHUB_SHA"
          --release-name "compatforge-$GITHUB_SHA"
          --artifact compatforge-web-build.tar.gz
          --artifact compatforge-web.spdx.json

      - name: Verify release manifest and every recorded digest
        run: >-
          python -m compatforge_pipeline.release_manifest verify
          --repository-root .
          --release-root build/release
          --manifest build/release/COMPATFORGE_RELEASE_MANIFEST.json
          --expected-commit "$GITHUB_SHA"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatforge-release-provenance
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  attest-release-bundle:
    name: Attest release bundle
    if: github.event_name != 'pull_request'
    needs: build-release-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatforge-release-provenance
          path: build/release

      - name: Attest release manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release/COMPATFORGE_RELEASE_MANIFEST.json

      - name: Attest web build provenance and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release/compatforge-web-build.tar.gz
          sbom-path: build/release/compatforge-web.spdx.json

      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            build/release/COMPATFORGE_RELEASE_MANIFEST.json \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify \
            build/release/compatforge-web-build.tar.gz \
            --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: Publish and verify immutable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-release-bundle
      - attest-release-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install release acceptance tooling
        run: python -m pip install -e "."

      - name: Require release-ready repository and production state
        env:
          COMPATFORGE_RELEASE_ADMIN_TOKEN: ${{ secrets.COMPATFORGE_RELEASE_ADMIN_TOKEN }}
          COMPATFORGE_RELEASE_CREATION_ACTOR_TYPE: ${{ vars.COMPATFORGE_RELEASE_CREATION_ACTOR_TYPE }}
          COMPATFORGE_RELEASE_CREATION_ACTOR_ID: ${{ vars.COMPATFORGE_RELEASE_CREATION_ACTOR_ID }}
        run: >-
          python -m compatforge_pipeline.release_acceptance
          --commit "$GITHUB_SHA"
          --tag "$GITHUB_REF_NAME"
          --output build/release-acceptance/report.json

      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatforge-release-provenance
          path: build/release

      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--draft --verify-tag --generate-notes --title "CompatForge $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *"-rc."* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" build/release/* "${flags[@]}"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify immutable release and every asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release verify "$GITHUB_REF_NAME"
          for asset in build/release/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset"
          done
