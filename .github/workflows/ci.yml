name: CompatForge CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check pipeline tests

      - name: Test
        run: pytest -q

      - name: Validate synthetic and reviewed evidence
        run: >-
          python -m compatforge_pipeline.validate
          data/fixtures
          data/evidence/vendor
          data/evidence/observations

      - name: Resolver smoke test
        run: >-
          python -m compatforge_pipeline.resolver
          --query tests/queries/saleae-win11-x64.json
          --observations data/evidence/observations
          --support data/evidence/vendor

      - name: Verify packaged local snapshot
        run: >-
          compatforge-snapshot verify
          --observations data/evidence/observations
          --support data/evidence/vendor

      - name: Local explanation smoke test
        run: |
          compatforge-explain \
            --diagnostic data/fixtures/diagnostic_manifest.json \
            --output build/local-explanation.json
          compatforge-validate build/local-explanation.json

  diagnostic-agent:
    name: Diagnostic agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Collect host-only diagnostic
        run: compatforge-diagnose --host-only --output build/diagnostic.json

      - name: Validate diagnostic contract
        run: python -m compatforge_pipeline.validate build/diagnostic.json

      - name: Load packaged local snapshot
        run: compatforge-snapshot info

  data-platform:
    name: Deterministic identity and evidence snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install data stack
        run: python -m pip install -e ".[dev,data]"

      - name: Build first identity Bronze snapshot
        run: >-
          python -m compatforge_pipeline.identity_pipeline bronze
          --workspace build/platform-a
          --input tests/fixtures/usb.ids
          --retrieved-at 2026-01-01T00:00:00Z
          --source-url synthetic://tests/fixtures/usb.ids

      - name: Ingest first evidence snapshot
        run: >-
          python -m compatforge_pipeline.evidence_pipeline ingest
          --workspace build/platform-a
          --observations tests/fixtures/evidence/observations
          --support tests/fixtures/evidence/support
          --as-of 2026-09-07T00:00:00Z

      - name: Transform first platform with dbt
        env:
          COMPATFORGE_DUCKDB_PATH: ${{ github.workspace }}/build/platform-a/compatforge.duckdb
        run: dbt build --project-dir dbt/compatforge --profiles-dir dbt/compatforge

      - name: Export first identity snapshot
        run: python -m compatforge_pipeline.identity_pipeline snapshot --workspace build/platform-a

      - name: Export first evidence snapshot
        run: python -m compatforge_pipeline.evidence_pipeline snapshot --workspace build/platform-a

      - name: Build second identity Bronze snapshot
        run: >-
          python -m compatforge_pipeline.identity_pipeline bronze
          --workspace build/platform-b
          --input tests/fixtures/usb.ids
          --retrieved-at 2026-01-01T00:00:00Z
          --source-url synthetic://tests/fixtures/usb.ids

      - name: Ingest second evidence snapshot
        run: >-
          python -m compatforge_pipeline.evidence_pipeline ingest
          --workspace build/platform-b
          --observations tests/fixtures/evidence/observations
          --support tests/fixtures/evidence/support
          --as-of 2026-09-07T00:00:00Z

      - name: Transform second platform with dbt
        env:
          COMPATFORGE_DUCKDB_PATH: ${{ github.workspace }}/build/platform-b/compatforge.duckdb
        run: dbt build --project-dir dbt/compatforge --profiles-dir dbt/compatforge

      - name: Export second identity snapshot
        run: python -m compatforge_pipeline.identity_pipeline snapshot --workspace build/platform-b

      - name: Export second evidence snapshot
        run: python -m compatforge_pipeline.evidence_pipeline snapshot --workspace build/platform-b

      - name: Verify deterministic identity output
        run: >-
          python -m compatforge_pipeline.identity_pipeline verify
          build/platform-a/public/snapshot_manifest.json
          build/platform-b/public/snapshot_manifest.json

      - name: Verify deterministic evidence output
        run: >-
          python -m compatforge_pipeline.evidence_pipeline verify
          build/platform-a/public/evidence/snapshot_manifest.json
          build/platform-b/public/evidence/snapshot_manifest.json

      - name: Run data-layer tests
        run: pytest -q tests/test_identity_pipeline.py tests/test_evidence_pipeline.py

      - name: Upload reviewed synthetic platform snapshot
        uses: actions/upload-artifact@v7
        with:
          name: compatforge-synthetic-platform-snapshot
          path: |
            build/platform-a/manifests/
            build/platform-a/public/
          retention-days: 7

  web:
    name: Next.js web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
