name: Refresh USB identity snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/catalog/**"
      - "pipeline/compatforge_pipeline/usb_ids.py"
      - "pipeline/compatforge_pipeline/identity_pipeline.py"
      - "dbt/compatforge/**"
      - ".github/workflows/refresh-identities.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install data stack
        run: python -m pip install -e ".[data]"

      - name: Download and build reviewed source snapshot
        run: python -m compatforge_pipeline.identity_pipeline bronze --workspace build/live

      - name: Build analytical identity models
        env:
          COMPATFORGE_DUCKDB_PATH: ${{ github.workspace }}/build/live/compatforge.duckdb
        run: dbt build --project-dir dbt/compatforge --profiles-dir dbt/compatforge

      - name: Export public identity snapshot
        run: python -m compatforge_pipeline.identity_pipeline snapshot --workspace build/live

      - name: Verify release catalog identities remain upstream
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("data/catalog/release-preview-devices.json").read_text())
          snapshot = Path("build/live/public/device_catalog.jsonl")
          upstream_ids = {
              json.loads(line)["device_id"]
              for line in snapshot.read_text(encoding="utf-8").splitlines()
              if line
          }
          missing = sorted(item["id"] for item in catalog if item["id"] not in upstream_ids)
          if missing:
              raise SystemExit(f"release catalog identities missing upstream: {missing}")
          PY

      - name: Upload refresh candidate
        uses: actions/upload-artifact@v7
        with:
          name: compatforge-usb-identity-candidate
          path: |
            build/live/manifests/source_manifest.json
            build/live/public/
          retention-days: 14
