name: CompatForge Hardware CLI Release

on:
  pull_request:
    branches:
      - main
    paths:
      - "pipeline/**"
      - "schemas/**"
      - "tools/**"
      - "pyproject.toml"
      - "docs/CLI_RELEASE.md"
      - ".github/workflows/release-cli.yml"
  workflow_dispatch:
  push:
    tags:
      - "hw-cli-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build CLI (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary: dist/compatforge-hw
            asset: compatforge-hw-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: dist/compatforge-hw
            asset: compatforge-hw-linux-arm64.tar.gz
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary: dist/compatforge-hw.exe
            asset: compatforge-hw-windows-x86_64.zip
          - os: windows-11-arm
            platform: windows
            arch: arm64
            binary: dist/compatforge-hw.exe
            asset: compatforge-hw-windows-arm64.zip
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary: dist/compatforge-hw
            asset: compatforge-hw-macos-x86_64.tar.gz
          - os: macos-latest
            platform: macos
            arch: arm64
            binary: dist/compatforge-hw
            asset: compatforge-hw-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install release dependencies
        run: python -m pip install -e ".[release]"

      - name: Build standalone executable
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name compatforge-hw \
            --paths pipeline \
            --add-data "pipeline/compatforge_pipeline/resources:compatforge_pipeline/resources" \
            --copy-metadata compatforge-hw-pipeline \
            tools/compatforge_hw_entry.py

      - name: Smoke-test frozen CLI
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          "$BINARY" --version
          "$BINARY" snapshot-info
          "$BINARY" diagnose --host-only --output build/host-diagnostic.json
          "$BINARY" explain \
            --diagnostic data/fixtures/diagnostic_manifest.json \
            --output build/local-explanation.json
          if "$BINARY" prepare-contribution \
            --diagnostic data/fixtures/diagnostic_manifest.json \
            --explanation build/local-explanation.json \
            --output build/unapproved-handoff.json; then
            echo "unapproved contribution handoff unexpectedly succeeded" >&2
            exit 1
          fi
          "$BINARY" prepare-contribution \
            --diagnostic data/fixtures/diagnostic_manifest.json \
            --explanation build/local-explanation.json \
            --approve-export \
            --output build/contribution-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("build/contribution-handoff.json").read_text())
          assert payload["evidence_ready"] is False
          assert payload["privacy"]["automatic_upload"] is False
          assert payload["privacy"]["network_request_performed"] is False
          PY

      - name: Package release archive
        shell: bash
        run: >-
          python tools/package_cli_release.py
          --binary "${{ matrix.binary }}"
          --asset-name "${{ matrix.asset }}"
          --output-dir build/release

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/release/stage
          format: spdx-json
          output-file: build/release/${{ matrix.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: build/release/${{ matrix.asset }}

      - name: Attest SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: build/release/${{ matrix.asset }}
          sbom-path: build/release/${{ matrix.asset }}.spdx.json

      - name: Upload verified CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatforge-hw-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/${{ matrix.asset }}
            build/release/${{ matrix.asset }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish immutable-ready GitHub Release
    if: startsWith(github.ref, 'refs/tags/hw-cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download platform artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: compatforge-hw-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release manifest
        run: >-
          python tools/build_release_manifest.py
          --directory release-assets
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *"rc"* || "$GITHUB_REF_NAME" == *"alpha"* || "$GITHUB_REF_NAME" == *"beta"* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "CompatForge Hardware CLI $GITHUB_REF_NAME" \
            "${prerelease[@]}"
