name: Bootstrap web lockfile

on:
  push:
    branches:
      - phase-2/hardware-identity-platform

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: phase-2/hardware-identity-platform

      - name: Check lockfile
        id: lock
        shell: bash
        run: |
          if test -f apps/web/package-lock.json; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.lock.outputs.missing == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate lockfile
        if: steps.lock.outputs.missing == 'true'
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        if: steps.lock.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore: commit web dependency lockfile"
          git push origin HEAD:phase-2/hardware-identity-platform
