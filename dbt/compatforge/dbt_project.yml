name: compatforge
version: "0.2.0"
config-version: 2
profile: compatforge

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

# Persist completed models before separate read-only snapshot export processes.
on-run-end: ["checkpoint"]

models:
  compatforge:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
