[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compatforge-hw-pipeline"
version = "0.3.0rc1"
description = "Evidence and identity contract tooling for CompatForge hardware compatibility data"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Aarya Mody"}]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
data = [
  "duckdb==1.5.5",
  "dbt-core==1.12.3",
  "dbt-duckdb==1.11.0",
]
release = [
  "pyinstaller==6.22.2",
]

[project.scripts]
compatforge-hw = "compatforge_pipeline.cli:main"
compatforge-validate = "compatforge_pipeline.validate:main"
compatforge-identity = "compatforge_pipeline.identity_pipeline:main"
compatforge-resolve = "compatforge_pipeline.resolver:main"
compatforge-evidence = "compatforge_pipeline.evidence_pipeline:main"
compatforge-diagnose = "compatforge_pipeline.diagnostics:main"
compatforge-snapshot = "compatforge_pipeline.local_snapshot:main"
compatforge-explain = "compatforge_pipeline.local_explain:main"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
compatforge_pipeline = [
  "resources/*.json",
  "resources/schemas/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
